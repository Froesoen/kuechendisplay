<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kuechendisplay Diashow</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #bild {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }
  #bild.show { opacity: 1; }
</style>
</head>
<body>
<img id="bild" src="" alt="Diashow">
<script>
let intervalMs = 10000;
let timer = null;

async function ladeStatus() {
  try {
    const res = await fetch("img/status.json?_=" + Date.now());
    const status = await res.json();
    if (status.intervall) {
      intervalMs = Math.max(2000, status.intervall * 1000);
    }
  } catch (e) {
    console.warn("Status konnte nicht geladen werden", e);
  }
}

function zeigeBild() {
  const img = document.getElementById("bild");
  const neu = new Image();
  neu.onload = () => {
    img.src = neu.src;
    img.classList.add("show");
  };
  neu.onerror = () => console.warn("Bild konnte nicht geladen werden");
  neu.src = "img/current.jpg?_=" + Date.now();
}

async function tick() {
  await ladeStatus();
  zeigeBild();
  clearTimeout(timer);
  timer = setTimeout(tick, intervalMs);
}

tick();
</script>
</body>
</html>
