<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kuechendisplay Diashow</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  #bild {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    -webkit-user-drag: none;
  }
  #bild.show { opacity: 1; }
</style>
</head>
<body>
<img id="bild" src="" alt="Diashow" draggable="false">
<script>
const POLL_MS = 500;
const SWIPE_MIN_PX = 60;
const SWIPE_MAX_MS = 1000;
const API = location.protocol + "//" + location.hostname + ":8091";

let lastSeq = null;

function zeigeBild() {
  const img = document.getElementById("bild");
  const neu = new Image();
  neu.onload = () => {
    img.src = neu.src;
    img.classList.add("show");
  };
  neu.onerror = () => console.warn("Bild konnte nicht geladen werden");
  neu.src = "img/current.jpg?_=" + Date.now();
}

// Der Dienst erhoeht seq in status.json, sobald current.jpg ersetzt wurde.
async function poll() {
  try {
    const res = await fetch("img/status.json?_=" + Date.now(), { cache: "no-store" });
    const status = await res.json();
    if (status.seq !== undefined && status.seq !== lastSeq) {
      lastSeq = status.seq;
      zeigeBild();
    }
  } catch (e) {
    console.warn("Status konnte nicht geladen werden", e);
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

function senden(richtung) {
  fetch(API + "/api/" + richtung, { method: "POST", mode: "no-cors" })
    .catch((e) => console.warn("Navigation fehlgeschlagen", e));
}

let startX = null, startY = null, startT = 0;

function begin(x, y) {
  startX = x; startY = y; startT = Date.now();
}

function end(x, y) {
  if (startX === null) return;
  const dx = x - startX;
  const dy = y - startY;
  const dauer = Date.now() - startT;
  startX = null;
  if (Math.abs(dx) >= SWIPE_MIN_PX && Math.abs(dx) > Math.abs(dy) * 1.5 && dauer < SWIPE_MAX_MS) {
    // Wisch nach links = naechstes Bild, nach rechts = vorheriges Bild
    senden(dx < 0 ? "next" : "prev");
  }
}

document.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  begin(t.clientX, t.clientY);
}, { passive: true });

document.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];
  end(t.clientX, t.clientY);
}, { passive: true });

// Zum Testen am PC: Maus ziehen bzw. Pfeiltasten
document.addEventListener("mousedown", (e) => begin(e.clientX, e.clientY));
document.addEventListener("mouseup", (e) => end(e.clientX, e.clientY));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") senden("next");
  else if (e.key === "ArrowLeft") senden("prev");
});

poll();
</script>
</body>
</html>
