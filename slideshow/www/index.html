<!DOCTYPE html>
<html lang='de'>
<head>
<meta charset='UTF-8'>
<title>Kuechendisplay Diashow</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #bild {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    -webkit-user-drag: none;
  }
  #bild.show { opacity: 1; }
  .zone {
    position: fixed; top: 0; bottom: 0; width: 30%;
    background: rgba(255, 255, 255, 0.18);
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease-out;
  }
  #zone-links { left: 0; }
  #zone-rechts { right: 0; }
  .zone.flash { opacity: 1; transition: none; }
  #pause {
    display: none; position: fixed; left: 16px; bottom: 16px; width: 44px; height: 44px;
    border-radius: 50%; background: rgba(0, 0, 0, 0.55); opacity: 0.85;
    align-items: center; justify-content: center; gap: 6px; pointer-events: none;
  }
  #pause.on { display: flex; }
  #pause span { width: 6px; height: 18px; background: #fff; border-radius: 1px; }
  #blitz {
    position: fixed; top: 50%; left: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease-out;
  }
  #blitz.show { opacity: 1; transition: none; }
  #blitz .bar { width: 14px; height: 48px; margin: 0 6px; background: #fff; border-radius: 2px; }
  #blitz .tri { width: 0; height: 0; margin-left: 10px; border-style: solid; border-width: 28px 0 28px 46px; border-color: transparent transparent transparent #fff; }
  #debug {
    display: none; position: fixed; left: 72px; bottom: 8px; max-width: 70%;
    padding: 8px 12px; background: rgba(0, 0, 0, 0.8); color: #9f9;
    font: 16px/1.3 monospace; white-space: pre; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<img id='bild' src='' alt='Diashow' draggable='false'>
<div id='zone-links' class='zone'></div>
<div id='zone-rechts' class='zone'></div>
<div id='pause'><span></span><span></span></div>
<div id='blitz'></div>
<div id='debug'></div>
<script>
const POLL_MS = 500;
// Nach einem Tipp wird der Status zusaetzlich nach diesen Zeiten abgefragt,
// damit Bild bzw. Pause-Symbol nicht bis zum naechsten Takt warten.
const NACH_TIPP_MS = [150, 450];
// Tippen links / rechts blaettert zurueck / vor, Tippen in der Mitte haelt an bzw. setzt fort.
const ZONE_FRACTION = 0.3;
const TAP_MAX_MOVE_PX = 40;
const TAP_MAX_MS = 800;
const API = location.protocol + '//' + location.hostname + ':8091';
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

let lastSeq = null;
let lastStatus = {};
let anfrageZaehler = 0;
let angewendet = 0;
const logLines = [];

function zeigeDebug() {
  if (!DEBUG) return;
  const el = document.getElementById('debug');
  el.style.display = 'block';
  const s = lastStatus;
  const kopf = 'Bild ' + (s.index ?? '-') + ' / ' + (s.anzahl_bilder ?? '-') + '  ' + (s.datei ?? '')
    + '  [' + (s.reihenfolge ?? '-') + ']' + (s.aktiv === false ? '  [PAUSE]' : '');
  el.textContent = [kopf].concat(logLines).join('\n');
}

function dlog(text) {
  if (!DEBUG) return;
  logLines.push(new Date().toLocaleTimeString('de-DE') + ' ' + text);
  while (logLines.length > 8) logLines.shift();
  zeigeDebug();
}

function zeigePause() {
  document.getElementById('pause').classList.toggle('on', lastStatus.aktiv === false);
}

function zeigeBild() {
  const img = document.getElementById('bild');
  const neu = new Image();
  neu.onload = () => {
    img.src = neu.src;
    img.classList.add('show');
  };
  neu.onerror = () => console.warn('Bild konnte nicht geladen werden');
  neu.src = 'img/current.jpg?_=' + Date.now();
}

// Der Dienst erhoeht seq in status.json, sobald current.jpg ersetzt wurde.
// Antworten, die nach einer neueren Anfrage eintreffen, werden verworfen.
async function pruefeStatus() {
  const nr = ++anfrageZaehler;
  try {
    const res = await fetch('img/status.json?_=' + Date.now(), { cache: 'no-store' });
    const status = await res.json();
    if (nr < angewendet) return;
    angewendet = nr;
    lastStatus = status;
    if (status.seq !== undefined && status.seq !== lastSeq) {
      lastSeq = status.seq;
      zeigeBild();
    }
    zeigePause();
    zeigeDebug();
  } catch (e) {
    console.warn('Status konnte nicht geladen werden', e);
  }
}

async function poll() {
  await pruefeStatus();
  setTimeout(poll, POLL_MS);
}

function flash(seite) {
  const el = document.getElementById('zone-' + seite);
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 120);
}

// Kurzes Symbol in der Bildmitte: pausiert = true zeigt Pause, sonst Play.
function blitz(pausiert) {
  const el = document.getElementById('blitz');
  el.textContent = '';
  const teile = pausiert ? ['bar', 'bar'] : ['tri'];
  teile.forEach((klasse) => {
    const s = document.createElement('span');
    s.className = klasse;
    el.appendChild(s);
  });
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 150);
}

function senden(richtung) {
  dlog('senden ' + richtung);
  fetch(API + '/api/' + richtung, { method: 'POST', mode: 'no-cors' })
    .then(() => {
      NACH_TIPP_MS.forEach((ms) => setTimeout(pruefeStatus, ms));
    })
    .catch((e) => {
      console.warn('Bedienung fehlgeschlagen', e);
      dlog('FEHLER ' + e);
    });
}

let down = null;

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  down = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() };
});

document.addEventListener('pointerup', (e) => {
  if (!down || down.id !== e.pointerId) return;
  const d = down;
  down = null;
  const bewegt = Math.hypot(e.clientX - d.x, e.clientY - d.y);
  if (bewegt > TAP_MAX_MOVE_PX || Date.now() - d.t > TAP_MAX_MS) return;
  const anteil = e.clientX / window.innerWidth;
  if (anteil < ZONE_FRACTION) {
    flash('links');
    senden('prev');
  } else if (anteil > 1 - ZONE_FRACTION) {
    flash('rechts');
    senden('next');
  } else {
    // Mitte: laeuft die Diashow, wird sie jetzt angehalten (Pause-Symbol), sonst fortgesetzt
    blitz(lastStatus.aktiv !== false);
    senden('toggle');
  }
});

document.addEventListener('pointercancel', () => { down = null; });

// Zum Testen am PC: Pfeiltasten, Leertaste
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') senden('next');
  else if (e.key === 'ArrowLeft') senden('prev');
  else if (e.key === ' ') {
    e.preventDefault();
    blitz(lastStatus.aktiv !== false);
    senden('toggle');
  }
});

// Diagnose-Modus (?debug=1): zeigt Bildposition und die letzten Ereignisse
if (DEBUG) {
  ['pointerdown', 'pointerup', 'pointercancel', 'touchstart', 'touchend', 'click'].forEach((typ) => {
    document.addEventListener(typ, (e) => {
      const p = (e.changedTouches && e.changedTouches[0]) || e;
      dlog(typ + ' ' + Math.round(p.clientX) + ',' + Math.round(p.clientY) + (e.pointerType ? ' ' + e.pointerType : ''));
    }, { capture: true, passive: true });
  });
  zeigeDebug();
}

poll();
</script>
</body>
</html>
